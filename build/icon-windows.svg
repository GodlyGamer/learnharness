<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Windows app icon (personal fork, 2026-10-24): a T wearing an
       engineering hard hat, tipped to the side. Rendered to build/icon.ico
       by scripts/make-icons.mjs. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c32"/>
      <stop offset="1" stop-color="#0d0e11"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#f0a400"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="12"/>
  <!-- the T -->
  <g fill="#f1f2f4">
    <rect x="196" y="392" width="560" height="132" rx="34"/>
    <rect x="408" y="470" width="136" height="398" rx="34"/>
  </g>
  <!-- the hard hat, perched on the right end of the bar and tipped -->
  <g transform="translate(632 398) rotate(16)">
    <path d="M-150 -6 C-150 -138 -80 -200 0 -200 C80 -200 150 -138 150 -6 Z" fill="url(#hat)"/>
    <rect x="-26" y="-206" width="52" height="176" rx="22" fill="#d98e00"/>
    <path d="M-150 -6 C-150 -138 -80 -200 0 -200" fill="none" stroke="#fff3c4" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" transform="translate(30 22) scale(0.82)"/>
    <rect x="-205" y="-20" width="410" height="50" rx="25" fill="#f5b100"/>
    <rect x="-205" y="12" width="410" height="18" rx="9" fill="#c47e00" fill-opacity="0.65"/>
  </g>
</svg>
